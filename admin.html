/* ---------- moldura ---------- */
.stage{align-items:flex-start}
.wide{width:100%;max-width:1320px;min-height:800px;background:var(--bg);border-radius:20px;border:1px solid var(--line);box-shadow:var(--shadow-lg);overflow:hidden;display:flex}
#app{display:flex;flex-direction:column;flex:1;min-width:0}
.wide #app{flex-direction:row}
.proto-bar .sp{flex:1}
.proto-bar .seg{display:inline-flex;border:1px solid #444;border-radius:8px;overflow:hidden}
.proto-bar .seg button{border:0;border-radius:0;background:#2c2c2c}
.proto-bar .seg button[aria-pressed="true"]{background:#fff;color:var(--grafite);font-weight:800}

/* ---------- login ---------- */
.auth{flex:1;display:flex;align-items:center;justify-content:center;padding:28px 16px;background:radial-gradient(1200px 500px at 50% -10%,#0A63A8 0%,var(--azul) 45%,var(--azul-esc) 100%)}
.auth-card{background:var(--surface);border-radius:22px;box-shadow:var(--shadow-lg);padding:28px 22px;width:100%;max-width:400px}
.auth-card .logo{margin-bottom:4px}
.auth-card h2{font-size:22px;margin:18px 0 4px;font-weight:900}
.auth-card .sub{color:var(--muted);margin-bottom:18px}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:14px 0}
.divider::before,.divider::after{content:"";flex:1;border-top:1px solid var(--line)}
.g-btn{gap:10px}
.g-btn .g{width:18px;height:18px;border-radius:50%;background:conic-gradient(#EA4335 0 25%,#FBBC05 0 50%,#34A853 0 75%,#4285F4 0);display:inline-block}
.otp{display:flex;gap:8px;justify-content:center;margin:6px 0 16px}
.otp input{width:44px;height:54px;text-align:center;font-size:22px;font-weight:800;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);outline:none}
.otp input:focus{border-color:var(--azul);box-shadow:0 0 0 3px var(--azul-claro)}
.shield{width:54px;height:54px;border-radius:16px;background:var(--azul-claro);display:grid;place-items:center;font-size:26px;margin-bottom:6px}
.auth-foot{text-align:center;color:rgba(255,255,255,.7);font-size:12.5px;margin-top:14px;font-weight:700}
.link{border:0;background:none;color:var(--azul);font-weight:700;padding:0;cursor:pointer}
.link.danger{color:var(--bad)}

.side .brandbox{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.badge-logo{background:#fff;border-radius:11px;width:40px;height:40px;display:grid;place-items:center;flex:none}

.pagehead{display:flex;align-items:center;gap:12px;padding:22px 28px 6px}

.content{padding:8px 28px 32px}
.phone .content{padding:8px 14px 28px}
.phone .pagehead{padding:16px 14px 2px}
.phone .pagehead h1{font-size:21px}
.mtop{background:var(--azul);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;position:sticky;top:0;z-index:5}

.mtop .wm b{color:var(--laranja)}
.mtop .tagline{font-size:9px;font-weight:800;letter-spacing:.14em;opacity:.7}

.mtabs .n{background:var(--laranja);color:#fff;border-radius:999px;font-size:11px;padding:1px 6px;margin-left:4px}
.menu-pop{position:absolute;right:10px;top:54px;background:var(--surface);color:var(--text);border-radius:14px;box-shadow:var(--shadow-lg);padding:14px;min-width:220px;z-index:30}

.phone .kpis{grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}

.t-quiosque{background:var(--azul-claro)} .t-foodtruck{background:var(--laranja-claro)} .t-outro{background:var(--verde-claro)}

.lcard .kv2{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}

.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.lcard .act{margin-top:12px}
.table td{vertical-align:middle}

.tl{position:relative;padding:4px 0 10px}
.tl::before{content:"";position:absolute;left:-20px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--line-strong)}
.tl.done::before{background:var(--laranja);border-color:var(--laranja)}

.op-top{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px}

.op-tabs span{padding:7px 12px;border-radius:999px;font-weight:800;color:var(--muted);font-size:13.5px;white-space:nowrap;background:var(--areia)}
.op-tabs span.on{background:var(--azul);color:#fff}
.ro input,.ro select{pointer-events:none;background:var(--surface2)}
/* chat do ticket */
.thread{display:flex;flex-direction:column;gap:8px;margin:14px 0;max-height:300px;overflow:auto;padding:4px}
.msg{max-width:85%;padding:10px 12px;border-radius:14px 14px 14px 4px;background:var(--areia);font-size:14px}
.msg.me{align-self:flex-end;background:var(--azul);color:#fff;border-radius:14px 14px 4px 14px}
.msg small{display:block;font-weight:800;opacity:.75;margin-bottom:2px;font-size:11.5px}
.sheet h3{margin:0 0 6px;font-size:19px;font-weight:900}
.sheet .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.sheet-opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;margin-top:8px;font-weight:800}

.gest{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:28px 16px;background:var(--bg)}

.alert.col{flex-direction:column;align-items:flex-start;gap:4px}
.mono{font-variant-numeric:tabular-nums;letter-spacing:.01em}
.only-phone{display:none} .phone .only-phone{display:initial}
</style>
</head>

const fmtD=iso=>iso.slice(0,10).split('-').reverse().join('/');
const fmtDT=s=>fmtD(s.slice(0,10))+' '+s.slice(11);
const addDays=(iso,n)=>{const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);};
const daysTo=iso=>Math.round((new Date(iso+'T12:00:00')-new Date(HOJE+'T12:00:00'))/864e5);
const chip=([t,c])=>`<span class="chip ${c}">${t}</span>`;
const K=id=>KIOSKS.find(k=>k.id===id);
const feeOf=k=>k.fee==null?BASE_FEE:k.fee;
const feeTxt=k=>`${pct(feeOf(k))} <span class="muted small">${k.fee==null?'base':'negociada'}</span>`;
const ava=(k,lg)=>`<span class="est-ava t-${k.tipo} ${lg?'lg':''}">${k.emoji}</span>`;
const curTerms=()=>TERMS[TERMS.length-1];
const termsDeadline=()=>addDays(curTerms().vig,30);
const termsSusp=()=>addDays(termsDeadline(),S.etapas[0]);
const wide=()=>S.frame==='wide';
const nowISO=()=>{const n=new Date();return HOJE+' '+n.toTimeString().slice(0,5);};
function audit(acao,alvo,det){AUDIT.unshift({em:nowISO(),quem:ADMIN.nome,acao,alvo,det:det||''});}
function alertsOf(k){const a=[];if(k.cancel>10)a.push(`<span class="chip bad">Cancel. ${pct(k.cancel)}</span>`);if(k.cb>0)a.push(`<span class="chip warn">${k.cb} contestaç${k.cb>1?'ões':'ão'}</span>`);if(k.proc&&k.situ!=='suspenso')a.push(`<span class="chip bad">Em suspensão</span>`);return a;}
function toast(msg){document.querySelectorAll('.toast').forEach(t=>t.remove());const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2800);}
function modal(html){$('#modal-root').innerHTML=`<div class="overlay" data-act="close-overlay"><div class="sheet" role="dialog">${html}</div></div>`;}
function closeModal(){$('#modal-root').innerHTML='';}
function confirmModal(title,text,act,id,label){modal(`<h3>${title}</h3><p class="muted">${text}</p><div class="foot"><button class="btn" data-act="close">Voltar</button><button class="btn danger" data-act="${act}" data-id="${id||''}">${label||'Confirmar'}</button></div>`);}
const searchBox=(key,ph)=>`<div class="search"><input class="input" placeholder="${ph||'Buscar'}" data-filter="${key}" value="${esc(key.split('.').reduce((o,k)=>o[k],S))}"></div>`;
const filtBtn=(act,n)=>`<button class="btn" data-act="${act}">⚙ Filtros${n?` <span class="cnt">${n}</span>`:''}</button>`;
const sel=(key,label,opts)=>{const cur=key.split('.').reduce((o,k)=>o[k],S);return `<select class="input" data-filter="${key}"><option value="">${label}</option>${opts.map(([v,l])=>`<option value="${v}" ${cur===v?'selected':''}>${l}</option>`).join('')}</select>`;};

function viewEst(){
  if(S.kid) return viewKiosk(K(S.kid));

  const list=KIOSKS.filter(k=>(!q||(k.nome+k.cnpj+k.gestor).toLowerCase().includes(q))&&(!f.tipo||k.tipo===f.tipo)&&(!f.situ||k.situ===f.situ)&&(!f.verif||k.verif===f.verif)
    &&(!f.alerta||(f.alerta==='cancel'?k.cancel>10:f.alerta==='cb'?k.cb>0:!!k.proc)));
  const hot=KIOSKS.filter(k=>k.cancel>10&&k.situ!=='encerrado');
  const nf=[f.tipo,f.situ,f.verif,f.alerta].filter(Boolean).length;
  const vendas=KIOSKS.reduce((s,k)=>s+k.vendas,0);
  let rows;
  if(!list.length) rows='<div class="empty">Nenhum estabelecimento</div>';
  else if(wide()) rows=`<table class="table"><thead><tr><th>Estabelecimento</th><th>Situação</th><th>Recebimento</th><th>Comissão</th><th class="n">Vendas do mês</th><th>Alertas</th><th></th></tr></thead><tbody>
    ${list.map(k=>`<tr class="click" data-act="open-k" data-id="${k.id}"><td><div class="cell-est">${ava(k)}<div><b>${esc(k.nome)}</b> ${chip(TIPO[k.tipo])}<div class="sub">${esc(k.cnpj)} · ${esc(k.gestor)}</div></div></div></td>
      <td>${chip(SITU[k.situ])}</td><td>${chip(VERIF[k.verif])}</td><td>${feeTxt(k)}</td><td class="n"><b>${brl(k.vendas)}</b></td>
      <td><div class="row" style="flex-wrap:wrap;gap:4px">${alertsOf(k).join('')||'<span class="muted">—</span>'}</div></td>
      <td><button class="icon-btn" data-act="contato" data-id="${k.id}" title="Falar com o gestor">✉</button></td></tr>`).join('')}</tbody></table>`;
  else rows=`<div class="lcards">${list.map(k=>{const al=alertsOf(k);return `<div class="lcard click" data-act="open-k" data-id="${k.id}">
      <div class="top">${ava(k)}<div class="nm"><b>${esc(k.nome)}</b> ${chip(TIPO[k.tipo])}<div class="sub">${esc(k.cnpj)} · ${esc(k.gestor)}</div></div></div>
      <hr class="sep">
      <div class="kv2"><div><span class="lbl">Situação</span>${chip(SITU[k.situ])}</div><div><span class="lbl">Recebimento</span>${chip(VERIF[k.verif])}</div>
      <div><span class="lbl">Comissão</span><b>${feeTxt(k)}</b></div><div><span class="lbl">Vendas</span><b class="num">${brl(k.vendas)}</b></div></div>
      ${al.length?`<div class="tags">${al.join('')}</div>`:''}
      <div class="act"><button class="btn sm block" data-act="contato" data-id="${k.id}">✉ Falar com o gestor</button></div></div>`;}).join('')}</div>`;
  return shell(`
  <div class="kpis">
    <div class="kpi"><div class="v">${KIOSKS.filter(k=>k.situ==='ativo').length}</div><div class="l">Ativos</div></div>
    <div class="kpi"><div class="v">${KIOSKS.filter(k=>k.situ==='implantacao').length}</div><div class="l">Em configuração</div></div>
    <div class="kpi"><div class="v">${brl(vendas).replace(/,\d\d$/,'')}</div><div class="l">Vendas do mês</div></div>
    <div class="kpi ${hot.length?'hot':''}"><div class="v">${hot.length}</div><div class="l">Cancelamento &gt; 10%</div></div>
  </div>
  ${hot.length&&f.alerta!=='cancel'?`<div class="alert"><span>⚠ ${hot.length} estabelecimento${hot.length>1?'s':''} com cancelamento acima de 10% no mês</span><button class="btn sm" data-act="fk-hot">Ver</button></div>`:''}
  <div class="toolbar">${searchBox('fk.q','Buscar nome, CNPJ ou gestor')}${filtBtn('fk-open',nf)}</div>
  ${f.open?`<div class="panel fpanel">
    ${sel('fk.tipo','Tipo: todos',Object.entries(TIPO).map(([v,[l]])=>[v,l]))}
    ${sel('fk.situ','Situação: todas',Object.entries(SITU).map(([v,[l]])=>[v,l]))}
    ${sel('fk.verif','Recebimento: todos',Object.entries(VERIF).map(([v,[l]])=>[v,l]))}
    ${sel('fk.alerta','Alertas: todos',[['cancel','Cancelamento > 10%'],['cb','Com contestações'],['proc','Em suspensão']])}
    ${nf?`<button class="link" data-act="fk-clear" style="justify-self:start">Limpar filtros</button>`:''}
  </div>`:''}
  ${rows}`);
}
function procTimeline(k){
  const e=S.etapas,env=k.proc?k.proc.enviados:0;
  const st=[[`1º aviso · ${e[0]} dias`,0],[`2º aviso · ${e[1]} dias`,1],[`3º aviso · ${e[2]} dia${e[2]>1?'s':''}`,2],['Suspensão',3]];
  return `<div class="timeline">${st.map(([t,i])=>`<div class="tl ${i===3?'final':''} ${env>i?'done':''}"><b>${t}</b><div class="muted small">${env>i?(i===3?'Executada':'Enviado · app + WhatsApp'):'Agendado'}</div></div>`).join('')}</div>`;
}
function viewKiosk(k){

    <div class="row" style="flex-wrap:wrap"><button class="btn primary" data-act="k-reativar" data-id="${k.id}">Reativar</button><button class="btn" data-act="jump" data-v="g-susp">Ver tela do gestor</button><button class="btn danger" data-act="k-encerrar" data-id="${k.id}">Encerrar</button></div>`;

  else susp=`<p class="small muted" style="margin-top:0">Nenhum processo em andamento.</p><div class="row" style="flex-wrap:wrap"><button class="btn danger" data-act="k-proc" data-id="${k.id}">Iniciar suspensão</button><button class="btn" data-act="k-encerrar" data-id="${k.id}">Encerrar</button></div>`;

  <div class="kpis">
    <div class="kpi"><div class="v">${brl(k.vendas).replace(/,\d\d$/,'')}</div><div class="l">Vendas do mês</div></div>
    <div class="kpi ${k.cancel>10?'hot':''}"><div class="v">${pct(k.cancel)}</div><div class="l">Cancelamentos</div></div>
    <div class="kpi ${k.cb?'hot':''}"><div class="v">${k.cb}</div><div class="l">Contestações</div></div>
    <div class="kpi"><div class="v">${pct(feeOf(k))}</div><div class="l">Comissão ${k.fee==null?'base':'negociada'}</div></div>
  </div>
  <div class="cols2">
    <div class="panel"><h3>Dados</h3><div class="kv-list">
      <div class="r"><span>Gestor</span><span>${esc(k.gestor)}</span></div>
      <div class="r"><span>Celular</span><span>${esc(k.tel)}</span></div>
      <div class="r"><span>E-mail</span><span>${esc(k.email)}</span></div>
      <div class="r"><span>Termos</span><span>Versão ${k.termos.slice(1)} ${k.termos===ct?chip(['atual','ok']):chip(['falta aceitar','warn'])}</span></div></div></div>
    <div class="panel"><h3>Recebimentos</h3><div class="kv-list">
      <div class="r"><span>Verificação</span><span>${chip(VERIF[k.verif])}</span></div>
      <div class="r"><span>Razão social</span><span>${esc(k.razao)}</span></div>

    <div class="panel"><h3>Comissão</h3><div class="between"><span class="big" style="font-size:28px">${pct(feeOf(k))}</span><span class="muted small">${k.fee==null?'Base da plataforma':'Negociada'} · só produtos</span></div>
      <div class="row" style="margin-top:10px;flex-wrap:wrap"><button class="btn sm" data-act="k-fee" data-id="${k.id}">Alterar</button>${k.fee!=null?`<button class="btn sm ghost" data-act="k-fee-base" data-id="${k.id}">Voltar para a base</button>`:''}</div></div>

      <div class="r"><span>Tentativas</span><span>${ov.tent||3} ${ov.tent?chip(['ajustado','warn']):''}</span></div></div>
      <button class="btn sm" style="margin-top:10px" data-act="k-over" data-id="${k.id}">Ajustar</button></div>
  </div>
  <div class="section-title">Suspensão</div>
  <div class="panel">${susp}</div>
  <div class="section-title">Histórico</div>
  <div class="panel">${hist.length?hist.map(a=>`<div class="item small"><span><b>${esc(a.acao)}</b>${a.det?' · '+esc(a.det):''}</span><span class="muted num" style="white-space:nowrap">${fmtDT(a.em)}</span></div>`).join(''):'<div class="muted small">Sem registros.</div>'}</div>`);

/* ================= FINANCEIRO ================= */
function viewFin(){
  const fac={'2026-10':.28,'2026-09':1,'2026-08':.86}[S.fin.per];
  const rows=KIOSKS.filter(k=>k.vendas>0).map(k=>{const prod=+(k.vendas*.92*fac).toFixed(2),fee=feeOf(k),com=+(prod*fee/100).toFixed(2),est=+(com*k.cancel/100).toFixed(2);return{k,prod,fee,com,est,liq:+(com-est).toFixed(2)};});
  const T=rows.reduce((a,r)=>({prod:a.prod+r.prod,com:a.com+r.com,est:a.est+r.est,liq:a.liq+r.liq}),{prod:0,com:0,est:0,liq:0});
  const list=wide()?`<table class="table"><thead><tr><th>Estabelecimento</th><th class="n">Vendido</th><th class="n">Comissão</th><th class="n">Estornos</th><th class="n">Líquido</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td><div class="cell-est">${ava(r.k)}<b>${esc(r.k.nome)}</b></div></td><td class="n">${brl(r.prod)}</td><td class="n">${brl(r.com)} <span class="muted small">(${pct(r.fee)})</span></td><td class="n" style="color:var(--bad)">− ${brl(r.est)}</td><td class="n"><b>${brl(r.liq)}</b></td></tr>`).join('')}
    <tr class="total"><td>Total</td><td class="n">${brl(T.prod)}</td><td class="n">${brl(T.com)}</td><td class="n">− ${brl(T.est)}</td><td class="n">${brl(T.liq)}</td></tr></tbody></table>`

/* ================= RENDER ================= */
const JUMP=[['login','Login'],['2fa','2 etapas'],['est','Estabelecimentos'],['det','Detalhe: Quiosque do Zé'],['imp','Entrar como'],['fin','Financeiro'],['termos','Comissão e termos'],['bloq','Lista de bloqueio'],['tickets','Tickets'],['lgpd','LGPD'],['aud','Auditoria'],['g-susp','Gestor: suspenso'],['g-termos','Gestor: novos termos']];
function curJump(){ if(['login','2fa','imp','g-susp','g-termos'].includes(S.screen)) return S.screen; if(S.tab==='est'&&S.kid==='k2') return 'det'; return S.tab; }
function render(){
  const dev=$('#device'); dev.className=wide()?'wide':'phone';
  document.querySelectorAll('#pb-frame button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.f===S.frame));
  $('#pb-jump').innerHTML=JUMP.map(([v,l])=>`<option value="${v}" ${curJump()===v?'selected':''}>${l}</option>`).join('');
  const app=$('#app');
  if(S.screen==='login'||S.screen==='2fa'){app.innerHTML=viewLogin();return;}
  if(S.screen==='imp'){app.innerHTML=viewImp();return;}
  if(S.screen==='g-susp'){app.innerHTML=viewGSusp();return;}
  if(S.screen==='g-termos'){app.innerHTML=viewGTermos();return;}
  app.innerHTML={est:viewEst,fin:viewFin,termos:viewTermos,bloq:viewBloq,tickets:viewTickets,lgpd:viewLgpd,aud:viewAud}[S.tab]();
}
function jump(v){
  S.menu=false; closeModal();
  if(['login','2fa','g-susp','g-termos'].includes(v)){S.screen=v;return;}
  if(v==='imp'){S.kid=S.kid||'k1';S.screen='imp';return;}
  S.screen='app';
  if(v==='det'){S.tab='est';S.kid='k2';return;}
  S.tab=v;S.kid=null;
}
$('#pb-jump').onchange=e=>{jump(e.target.value);render();window.scrollTo(0,0);};
$('#pb-frame').onclick=e=>{const b=e.target.closest('button');if(b){S.frame=b.dataset.f;render();}};

/* ================= AÇÕES ================= */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b){if(S.menu){S.menu=false;render();}return;}
  const a=b.dataset.act,d=b.dataset;
  if(a==='close-overlay'&&e.target!==b) return;
  e.stopPropagation();
  switch(a){
    case 'go': S.screen=d.v; break;
    case 'jump': jump(d.v); break;
    case 'login-ok': S.screen='app'; S.tab='est'; toast('Bem-vindo, '+ADMIN.nome.split(' ')[0]+'!'); break;
    case 'logout': S.screen='login'; S.menu=false; break;
    case 'menu': S.menu=!S.menu; break;
    case 'tab': S.tab=d.tab; S.kid=null; S.menu=false; break;
    case 'toast': toast(d.msg); return;
    case 'close': case 'close-overlay': closeModal(); return;
    case 'fk-hot': S.fk.alerta='cancel'; S.fk.open=true; break;
    case 'fk-open': S.fk.open=!S.fk.open; break;
    case 'fk-clear': Object.assign(S.fk,{tipo:'',situ:'',verif:'',alerta:''}); break;
    case 'fb-open': S.fb.open=!S.fb.open; break;
    case 'ft-open': S.ft.open=!S.ft.open; break;
    case 'hist': S.hist=!S.hist; break;
    case 'read': { const t=TERMS.find(x=>x.v===d.v); return modal(`<h3>Termos de uso · versão ${t.v.slice(1)}</h3><div class="muted small">Vigência ${fmtD(t.vig)} · ${esc(t.resumo)}</div><div class="doc"><p>1. Objeto…</p><p>2. Comissão sobre os produtos…</p><p>3. Pagamentos e divisão…</p><p>4. Estornos e contestações…</p><p>5. Suspensão após avisos…</p><p>6. Suporte em modo leitura…</p><p>7. Privacidade e LGPD…</p></div><div class="foot"><button class="btn" data-act="close">Fechar</button></div>`); }
    case 'contato': { const k=K(d.id); return modal(`<h3>Falar com ${esc(k.gestor)}</h3><div class="muted small">${esc(k.nome)}</div>
      <button class="sheet-opt" data-act="close-toast" data-msg="Abrindo WhatsApp de ${esc(k.gestor)}"><span class="ic" style="background:var(--verde-claro)">💬</span><span>WhatsApp<small>${esc(k.tel)}</small></span></button>
      <button class="sheet-opt" data-act="close-toast" data-msg="Abrindo e-mail para ${esc(k.email)}"><span class="ic">✉</span><span>E-mail<small>${esc(k.email)}</small></span></button>
      <div class="foot"><button class="btn" data-act="close">Fechar</button></div>`); }
    case 'close-toast': closeModal(); toast(d.msg); return;
    case 'open-k': S.kid=d.id; window.scrollTo(0,0); break;
    case 'back': S.kid=null; break;
    case 'k-imp': { const k=K(d.id); return modal(`<h3>Entrar como gestor?</h3><p class="muted">Você verá o painel de <b>${esc(k.nome)}</b> sem poder alterar nada. Fica registrado na auditoria.</p><div class="foot"><button class="btn" data-act="close">Voltar</button><button class="btn blue" data-act="k-imp-ok" data-id="${k.id}">👁 Entrar</button></div>`); }
    case 'k-imp-ok': audit('Entrar como (leitura)',K(d.id).nome,'Suporte'); closeModal(); S.kid=d.id; S.screen='imp'; break;
    case 'imp-exit': S.screen='app'; S.tab='est'; break;
    case 'k-cnpj': { const k=K(d.id); return modal(`<h3>Alterar CNPJ</h3><p class="muted small">Só a pedido do negócio. Exige nova verificação.</p>
      <div class="field"><label>CNPJ</label><input class="input" id="n-cnpj" value="${esc(k.cnpj)}"></div><div class="field"><label>Razão social</label><input class="input" id="n-razao" value="${esc(k.razao)}"></div>
      <div class="field"><label>Motivo</label><input class="input" id="n-mot" placeholder="Ex.: ticket T-102"></div>
      <div class="foot"><button class="btn" data-act="close">Cancelar</button><button class="btn primary" data-act="k-cnpj-ok" data-id="${k.id}">Alterar</button></div>`); }
    case 'k-cnpj-ok': { const k=K(d.id),m=$('#n-mot').value.trim(); if(!m) return toast('Informe o motivo'); k.cnpj=$('#n-cnpj').value; k.razao=$('#n-razao').value; k.verif='em-analise'; audit('CNPJ alterado a pedido',k.nome,m); closeModal(); toast('Alterado. Recebimento em análise.'); break; }
    case 'k-fee': { const k=K(d.id); return modal(`<h3>Comissão · ${esc(k.nome)}</h3><div class="field"><label>% sobre os produtos</label><input class="input" type="number" step="0.1" id="n-fee" value="${feeOf(k)}"></div><div class="field"><label>Motivo</label><input class="input" id="n-fee-mot" placeholder="Ex.: volume alto"></div><p class="muted small">Vale para pagamentos novos, após o aceite do gestor.</p><div class="foot"><button class="btn" data-act="close">Cancelar</button><button class="btn primary" data-act="k-fee-ok" data-id="${k.id}">Salvar</button></div>`); }
    case 'k-fee-ok': { const k=K(d.id),old=feeOf(k); k.fee=+$('#n-fee').value; audit('Comissão alterada',k.nome,`${pct(old)} → ${pct(k.fee)}`); closeModal(); toast('Salvo. Gestor avisado para aceitar.'); break; }
    case 'k-fee-base': { const k=K(d.id); k.fee=null; audit('Comissão voltou para a base',k.nome,''); toast('Agora usa a comissão base'); break; }
    case 'k-over': { const k=K(d.id),o=k.over; return modal(`<h3>Regras fixas · ${esc(k.nome)}</h3><p class="muted small">Só em caso excepcional.</p>
      <div class="grid2"><div class="field"><label>Pix (min)</label><input class="input" type="number" id="o-pix" value="${o.pix||10}"></div><div class="field"><label>Cartão (min)</label><input class="input" type="number" id="o-card" value="${o.card||5}"></div></div>
      <div class="field"><label>Tentativas</label><input class="input" type="number" id="o-tent" value="${o.tent||3}"></div><div class="field"><label>Motivo</label><input class="input" id="o-mot"></div>
      <div class="foot"><button class="btn" data-act="close">Cancelar</button><button class="btn primary" data-act="k-over-ok" data-id="${k.id}">Salvar</button></div>`); }
    case 'k-over-ok': { const k=K(d.id),m=$('#o-mot').value.trim(); if(!m) return toast('Informe o motivo'); const p=+$('#o-pix').value,c=+$('#o-card').value,t=+$('#o-tent').value; k.over={pix:p!==10?p:undefined,card:c!==5?c:undefined,tent:t!==3?t:undefined}; audit('Regras fixas ajustadas',k.nome,m); closeModal(); toast('Ajuste salvo'); break; }
    case 'k-proc': { const k=K(d.id); return modal(`<h3>Iniciar suspensão</h3><div class="muted small">${esc(k.nome)}</div>
      <div class="field" style="margin-top:12px"><label>Motivo</label><textarea class="input" id="p-mot" rows="2" placeholder="Ex.: cancelamento acima de 10%"></textarea></div>
      <div class="field"><label>Avisos (dias antes)</label><div class="days"><input class="input" type="number" id="e1" value="${S.etapas[0]}"><input class="input" type="number" id="e2" value="${S.etapas[1]}"><input class="input" type="number" id="e3" value="${S.etapas[2]}"></div></div>
      <p class="muted small">Pelo app e WhatsApp. Sem contato, suspende no fim.</p>
      <div class="foot"><button class="btn" data-act="close">Cancelar</button><button class="btn danger" data-act="k-proc-ok" data-id="${k.id}">Iniciar</button></div>`); }
    case 'k-proc-ok': { const k=K(d.id),m=$('#p-mot').value.trim(); if(!m) return toast('Informe o motivo'); S.etapas=[+$('#e1').value,+$('#e2').value,+$('#e3').value]; k.proc={motivo:m,inicio:HOJE,enviados:1}; audit('Iniciou suspensão',k.nome,m); closeModal(); toast('1º aviso enviado ao gestor'); break; }
    case 'k-aviso': { const k=K(d.id); if(k.proc.enviados<3){k.proc.enviados++; toast(`${k.proc.enviados}º aviso enviado ao gestor`);} else {k.proc.enviados=4; k.situ='suspenso'; k.suspensoEm=HOJE; audit('Estabelecimento suspenso',k.nome,'Sem contato após 3 avisos'); toast('Sem contato: estabelecimento suspenso');} break; }
    case 'k-proc-cancel': { const k=K(d.id); k.proc=null; audit('Cancelou suspensão',k.nome,''); toast('Processo cancelado. Gestor avisado.'); break; }
    case 'k-suspender': return confirmModal('Suspender agora?','Para de receber pedidos na hora. O gestor vê o motivo ao entrar.','k-suspender-ok',d.id,'Suspender');
    case 'k-suspender-ok': { const k=K(d.id); k.situ='suspenso'; k.suspensoEm=HOJE; k.proc=k.proc||{motivo:'—',inicio:HOJE}; k.proc.enviados=4; audit('Estabelecimento suspenso',k.nome,k.proc.motivo); closeModal(); toast('Suspenso. Gestor avisado.'); break; }
    case 'k-reativar': { const k=K(d.id); k.situ='ativo'; k.proc=null; k.suspensoEm=null; audit('Estabelecimento reativado',k.nome,''); toast('Reativado'); break; }
    case 'k-encerrar': return confirmModal('Encerrar?','Sai da plataforma e fica só o histórico. Use quando o contrato terminar.','k-encerrar-ok',d.id,'Encerrar');
    case 'k-encerrar-ok': { const k=K(d.id); k.situ='encerrado'; k.proc=null; audit('Estabelecimento encerrado',k.nome,''); closeModal(); toast('Encerrado'); break; }
    case 'fee-base': return modal(`<h3>Comissão base</h3><div class="field"><label>% sobre os produtos</label><input class="input" type="number" step="0.1" id="nb" value="${BASE_FEE}"></div><div class="field"><label>Vale a partir de</label><input class="input" type="date" id="nb-vig" value="2026-11-08"></div><p class="muted small">Gestores leem e aceitam. Não muda comissões negociadas.</p><div class="foot"><button class="btn" data-act="close">Cancelar</button><button class="btn primary" data-act="fee-base-ok">Publicar</button></div>`);
    case 'fee-base-ok': { const old=BASE_FEE; BASE_FEE=+$('#nb').value; audit('Comissão base alterada','Plataforma',`${pct(old)} → ${pct(BASE_FEE)}`); closeModal(); toast('Publicado. Gestores avisados.'); break; }
    case 'terms-new': return modal(`<h3>Nova versão</h3><div class="field"><label>Resumo</label><input class="input" id="tr" placeholder="Ex.: nova regra de suspensão"></div><div class="field"><label>Texto</label><textarea class="input" rows="5" placeholder="Cole o documento"></textarea></div><div class="field"><label>Vale a partir de</label><input class="input" type="date" id="tvig" value="2026-11-08"></div><div class="foot"><button class="btn" data-act="close">Cancelar</button><button class="btn primary" data-act="terms-ok">Publicar</button></div>`);
    case 'terms-ok': { const v='v'+(TERMS.length+1); TERMS.push({v,vig:$('#tvig').value||HOJE,resumo:$('#tr').value.trim()||'Atualização'}); audit('Nova versão dos termos','Plataforma','Versão '+v.slice(1)); closeModal(); toast('Publicado. Gestores aceitam no próximo acesso.'); break; }
    case 'terms-accept': if(!$('#t-ok').checked) return toast('Marque "Li e concordo"'); { const k=KIOSKS.find(x=>x.termos!==curTerms().v&&x.situ!=='encerrado'); if(k) k.termos=curTerms().v; toast('Termos aceitos'); jump('termos'); } break;
    case 'blk-new': return modal(`<h3>🚫 Bloquear</h3><p class="muted small">Fraude evidente. Vale em todos os negócios.</p><div class="field"><label>Celular</label><input class="input" id="bk-tel" placeholder="(13) 99999-0000"></div><div class="field"><label>Cartão (opcional)</label><input class="input" id="bk-card" placeholder="Final do cartão"></div><div class="field"><label>Motivo</label><textarea class="input" id="bk-mot" rows="2"></textarea></div><div class="foot"><button class="btn" data-act="close">Cancelar</button><button class="btn danger" data-act="blk-ok">Bloquear</button></div>`);
    case 'blk-ok': { const m=$('#bk-mot').value.trim(); if(!m) return toast('Informe o motivo'); BLOCKS.unshift({id:'b'+Date.now(),tel:$('#bk-tel').value||'(13) 90000-0000',card:$('#bk-card').value?('•••• '+$('#bk-card').value):'—',nivel:'bloqueado',cb:0,origem:'Fraude evidente · equipe PedeAí',desde:HOJE}); audit('Cliente bloqueado','Lista de bloqueio',m); closeModal(); toast('Bloqueado em todos os negócios'); break; }
    case 'blk-rev': return modal(`<h3>Revogar bloqueio</h3><div class="field"><label>Motivo</label><input class="input" id="rv-mot" placeholder="Ex.: ticket T-104"></div><div class="foot"><button class="btn" data-act="close">Cancelar</button><button class="btn primary" data-act="blk-rev-ok" data-id="${d.id}">Revogar</button></div>`);
    case 'blk-rev-ok': { const m=$('#rv-mot').value.trim(); if(!m) return toast('Informe o motivo'); BLOCKS=BLOCKS.filter(x=>x.id!==d.id); audit('Bloqueio revogado','Lista de bloqueio',m); closeModal(); toast('Bloqueio revogado'); break; }
    case 'tk-open': return modalTicket(d.id);
    case 'tk-save': { const t=TICKETS.find(x=>x.id===d.id),m=$('#tk-msg').value.trim(); if(m) t.msgs.push(['admin',m]); t.st=$('#tk-st').value; t.vinc=$('#tk-vinc').value; closeModal(); toast(m?'Resposta enviada':'Ticket atualizado'); break; }
    case 'lgpd-find': S.lgpdQ=$('#lgpd-tel').value.trim()||'(13) 98888-1111'; S.lgpdFound=true; break;
    case 'lgpd-anon': return confirmModal('Apagar dados?','Nome, celular, e-mail e endereços somem para sempre. Os pedidos ficam, sem dados pessoais.','lgpd-ok','','Apagar');
    case 'lgpd-ok': audit('Dados apagados (LGPD)','Cliente '+maskTel(S.lgpdQ),'Pedido do cliente'); S.lgpdFound=false; S.lgpdQ=''; closeModal(); toast('Dados apagados'); break;
  }
  render();
});
document.addEventListener('input',e=>{
  const f=e.target.dataset.filter;
  if(f&&e.target.tagName==='INPUT'){const [o,k]=f.split('.');S[o][k]=e.target.value;const pos=e.target.selectionStart;render();const el=document.querySelector(`[data-filter="${f}"]`);if(el){el.focus();try{el.setSelectionRange(pos,pos);}catch(_){}}}
  if(e.target.dataset.otp!=null&&e.target.value){const nx=document.querySelector(`[data-otp="${+e.target.dataset.otp+1}"]`);if(nx)nx.focus();}
});
document.addEventListener('change',e=>{const f=e.target.dataset.filter;if(f&&e.target.tagName==='SELECT'){const [o,k]=f.split('.');S[o][k]=e.target.value;render();}});
render();
</script>
</body>
</html>
